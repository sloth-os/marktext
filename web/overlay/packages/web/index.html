<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MarkText</title>
    <meta name="description" content="MarkText — a WYSIWYG markdown editor that works in your browser and offline." />
    <meta name="theme-color" content="#2c3e50" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MarkText" />
    <link rel="manifest" href="/manifest.webmanifest" />
   <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f8f8f8;
      }
      #app {
        height: 100%;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8f8f8;
        color: #2c3e50;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      .boot-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .boot-splash .logo {
        width: 72px;
        height: 72px;
        margin-bottom: 16px;
        animation: pulse 1.4s ease-in-out infinite;
      }
      .boot-splash .title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .boot-splash .status {
        margin-top: 6px;
        font-size: 13px;
        opacity: 0.6;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.97);
        }
        50% {
          opacity: 1;
          transform: scale(1.03);
        }
      }
 </style>
    <!--
      prismjs language component scripts (including the mermaid-language one
      co-bundled into the vendor chunk) reference the global `Prism` and call
      Prism.languages.extend at module-evaluation time, before any ES module
      has had a chance to assign it. Load the real prismjs core as a classic
      script first: muya's patched prism module then adopts this instance
      (`window.Prism = window.Prism || Prism`, see patches/0002) so every
      consumer — muya, mermaid, and the dynamically imported components —
      shares one language registry.
    -->
    <script src="/vendor/prism-core.js"></script>
  </head>

  <body>
    <div id="app">
      <div class="boot-splash" id="boot-splash">
        <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.6" />
          <path d="M6 9.5l3 3-3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M12.5 15.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <div class="title">MarkText</div>
        <div class="status" id="boot-status">Loading editor…</div>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
